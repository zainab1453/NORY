<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURI ♥</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            /* تغيير الخلفية إلى تدرج بينك ناعم وهادئ */
            background: linear-gradient(135deg, #fff0f5 0%, #fbc2eb 100%);
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* تأثير القلوب المتساقطة بلون وردي متناسق */
        .heart-bg {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            opacity: 0.4;
            animation: fall linear infinite;
            z-index: 1;
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 100%;
            max-width: 600px;
        }

        /* القلب الكبير النابض بلون روز غامق */
        .main-heart {
            font-size: 80px;
            color: #d81b60;
            margin-bottom: -10px;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* الاسم الرئيسي بلون ماجنتا/بينك داكن ومميز */
        h1 {
            font-size: 4rem;
            color: #c2185b;
            margin: 10px 0;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* منطقة الجمل المتغيرة */
        .text-box {
            min-height: 80px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .message {
            font-size: 1.8rem;
            color: #4a001f;
            font-weight: bold;
            line-height: 1.6;
            padding-left: 8px;
            overflow: hidden;
        }

        /* تغيير زر كمان إلى لون فوشيا/بينك غامق متناسق جداً */
        .btn {
            background-color: #d81b60;
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            background-color: #ff4081;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
        }
        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-heart">♥</div>
        <h1>NOURI</h1> 
        
        <div class="text-box">
            <div class="message" id="msg">الدنيا مابتكونش مبهجة غير بوجود ناس شبيهة بقلبك زي نوري..</div>
        </div>

        <button class="btn" onclick="nextMessage()">♥ كمان</button>
    </div>

    <script>
        const messages = [
            "الدنيا مابتكونش مبهجة غير بوجود ناس شبيهة بقلبك زيك يـ نوري..",
            "إنتي أجمل صاحبة، وبجد عرفتيني إنها مش بالسنين.. بحبك أوي يـ نوري ♥",
            "ممتنة جداً لكل ضحكة وكل لحظة حلوة شاركتها معاكي..",
            "إنتي مش بس صديقة عمري، إنتي الجزء الثابت والجميل وسط زحمة الأيام..",
            "بحبك جدا ومهما مرت بينا الايام هتفضلي الركن اللي بحب الجأله فـ يومي.. ♥"
     ];

        let currentIndex = 0;

        function nextMessage() {
            currentIndex = (currentIndex + 1) % messages.length;
            const msgElement = document.getElementById('msg');
            msgElement.innerText = messages[currentIndex];
        }

        // كود توليد القلوب المتساقطة تلقائياً في الخلفية
        function createHearts() {
            for (let i = 0; i < 30; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = '♥';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * -20 + 'vh';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                document.body.appendChild(heart);
            }
        }
        createHearts();
    </script>
</body>
</html>
